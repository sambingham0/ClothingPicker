<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Background Removal Test</title>
</head>
<body>
    <h1>Upload Clothing Image</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" title="file" name="file" accept="image/*" required>
        
        <fieldset>
            <legend>Clothing Type</legend>
            <label><input type="radio" name="clothingType" value="top"> Top</label>
            <label><input type="radio" name="clothingType" value="bottom"> Bottom</label>
            <label><input type="radio" name="clothingType" value="layer"> Layer</label>
            <label><input type="radio" name="clothingType" value="top_layer"> Top or Layer</label>
        </fieldset>

        <fieldset>
            <legend>Clothing Major Color(s)</legend>
            <label><input type="checkbox" name="clothingColor" value="red"> Red</label>

            <label><input type="checkbox" name="clothingColor" value="maroon"> Maroon</label>
            <label><input type="checkbox" name="clothingColor" value="olive"> Olive</label>
            <label><input type="checkbox" name="clothingColor" value="gold"> Gold</label>
            <label><input type="checkbox" name="clothingColor" value="silver"> Silver</label>
            <label><input type="checkbox" name="clothingColor" value="turquoise"> Turquoise</label>
            <label><input type="checkbox" name="clothingColor" value="coral"> Coral</label>
            <label><input type="checkbox" name="clothingColor" value="ivory"> Ivory</label>
            <label><input type="checkbox" name="clothingColor" value="khaki"> Khaki</label>
            <label><input type="checkbox" name="clothingColor" value="lavender"> Lavender</label>
            <label><input type="checkbox" name="clothingColor" value="mint"> Mint</label>
            <label><input type="checkbox" name="clothingColor" value="peach"> Peach</label>
            <label><input type="checkbox" name="clothingColor" value="mustard"> Mustard</label>
            <label><input type="checkbox" name="clothingColor" value="burgundy"> Burgundy</label>
            <label><input type="checkbox" name="clothingColor" value="cream"> Cream</label>
            <label><input type="checkbox" name="clothingColor" value="charcoal"> Charcoal</label>
            <label><input type="checkbox" name="clothingColor" value="denim"> Denim</label>
            <label><input type="checkbox" name="clothingColor" value="magenta"> Magenta</label>
            <label><input type="checkbox" name="clothingColor" value="lime"> Lime</label>
            <label><input type="checkbox" name="clothingColor" value="aqua"> Aqua</label>
            <label><input type="checkbox" name="clothingColor" value="bronze"> Bronze</label>
            <label><input type="checkbox" name="clothingColor" value="copper"> Copper</label>
            <label><input type="checkbox" name="clothingColor" value="tan"> Tan</label>
            <label><input type="checkbox" name="clothingColor" value="sand"> Sand</label>

        <fieldset>

            <label><input type="checkbox" name="clothingMinorColor" value="sand"> Sand</label>
