<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Upload</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="../stylist/index.html">Stylist</a>
        <a href="../upload/index.html">Upload</a>
    </nav>
    <h1>Upload Clothing Image</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" title="file" name="file" accept="image/*" required>
        <label for="fileInput" class="custom-file-upload">Choose Image</label>
        <span id="fileNameDisplay"></span>
        
        <fieldset>
            <legend>Clothing Type</legend>
            <label><input type="radio" name="clothingType" value="top"> Top</label>
            <label><input type="radio" name="clothingType" value="bottom"> Bottom</label>
            <label><input type="radio" name="clothingType" value="layer"> Layer</label>
            <label><input type="radio" name="clothingType" value="top_layer"> Top or Layer</label>
        </fieldset>

        <fieldset id="sleeveLengthFieldset" class="conditional-fieldset" hidden>
            <legend>Sleeve Length</legend>
            <p class="helper-text">Required for tops and layers.</p>
            <label><input type="radio" name="sleeveLength" value="short_sleeve"> Short Sleeve</label>
            <label><input type="radio" name="sleeveLength" value="long_sleeve"> Long Sleeve</label>
        </fieldset>

        <fieldset id="bottomStyleFieldset" class="conditional-fieldset" hidden>
            <legend>Bottom Style</legend>
            <p class="helper-text">Required for bottoms.</p>
            <label><input type="radio" name="bottomStyle" value="shorts"> Shorts</label>
            <label><input type="radio" name="bottomStyle" value="pants"> Pants</label>
        </fieldset>

        <fieldset>
            <legend>Clothing Major Color(s)</legend>
                <label><input type="checkbox" name="clothingColor" value="black"> Black</label>
                <label><input type="checkbox" name="clothingColor" value="white"> White</label>
                <label><input type="checkbox" name="clothingColor" value="gray"> Gray</label>
                <label><input type="checkbox" name="clothingColor" value="navy"> Navy</label>
                <label><input type="checkbox" name="clothingColor" value="blue"> Blue</label>
                <label><input type="checkbox" name="clothingColor" value="red"> Red</label>
                <label><input type="checkbox" name="clothingColor" value="green"> Green</label>
                <label><input type="checkbox" name="clothingColor" value="brown"> Brown</label>
                <label><input type="checkbox" name="clothingColor" value="beige"> Beige</label>
                <label><input type="checkbox" name="clothingColor" value="tan"> Tan</label>
                <label><input type="checkbox" name="clothingColor" value="olive"> Olive</label>
                <label><input type="checkbox" name="clothingColor" value="khaki"> Khaki</label>
                <label><input type="checkbox" name="clothingColor" value="yellow"> Yellow</label>
                <label><input type="checkbox" name="clothingColor" value="orange"> Orange</label>
                <label><input type="checkbox" name="clothingColor" value="pink"> Pink</label>
                <label><input type="checkbox" name="clothingColor" value="purple"> Purple</label>
                <label><input type="checkbox" name="clothingColor" value="burgundy"> Burgundy</label>
                <label><input type="checkbox" name="clothingColor" value="cream"> Cream</label>
                <label><input type="checkbox" name="clothingColor" value="denim"> Denim</label>
                <label><input type="checkbox" name="clothingColor" value="teal"> Teal</label>
        </fieldset>

        <fieldset>
            <legend>Clothing Minor Color(s)</legend>
                <label><input type="checkbox" name="clothingMinorColor" value="black"> Black</label>
                <label><input type="checkbox" name="clothingMinorColor" value="white"> White</label>
                <label><input type="checkbox" name="clothingMinorColor" value="gray"> Gray</label>
                <label><input type="checkbox" name="clothingMinorColor" value="navy"> Navy</label>
                <label><input type="checkbox" name="clothingMinorColor" value="blue"> Blue</label>
                <label><input type="checkbox" name="clothingMinorColor" value="red"> Red</label>
                <label><input type="checkbox" name="clothingMinorColor" value="green"> Green</label>
                <label><input type="checkbox" name="clothingMinorColor" value="brown"> Brown</label>
                <label><input type="checkbox" name="clothingMinorColor" value="beige"> Beige</label>
                <label><input type="checkbox" name="clothingMinorColor" value="tan"> Tan</label>
                <label><input type="checkbox" name="clothingMinorColor" value="olive"> Olive</label>
                <label><input type="checkbox" name="clothingMinorColor" value="khaki"> Khaki</label>
                <label><input type="checkbox" name="clothingMinorColor" value="yellow"> Yellow</label>
                <label><input type="checkbox" name="clothingMinorColor" value="orange"> Orange</label>
                <label><input type="checkbox" name="clothingMinorColor" value="pink"> Pink</label>
                <label><input type="checkbox" name="clothingMinorColor" value="purple"> Purple</label>
                <label><input type="checkbox" name="clothingMinorColor" value="burgundy"> Burgundy</label>
                <label><input type="checkbox" name="clothingMinorColor" value="cream"> Cream</label>
                <label><input type="checkbox" name="clothingMinorColor" value="denim"> Denim</label>
                <label><input type="checkbox" name="clothingMinorColor" value="teal"> Teal</label>
        </fieldset>

        <fieldset>
            <legend>Season</legend>
            <label><input type="checkbox" name="season" value="spring"> Spring</label>
            <label><input type="checkbox" name="season" value="summer"> Summer</label>
            <label><input type="checkbox" name="season" value="fall"> Fall</label>
            <label><input type="checkbox" name="season" value="winter"> Winter</label>
        </fieldset>

        <fieldset>
            <legend>Occasion</legend>
            <label><input type="checkbox" name="occasion" value="casual"> Casual</label>
            <label><input type="checkbox" name="occasion" value="business"> Business</label>
            <label><input type="checkbox" name="occasion" value="formal"> Formal</label>
            <label><input type="checkbox" name="occasion" value="sport"> Sport</label>
        </fieldset>

        <fieldset>
            <legend>Fit</legend>
            <label><input type="radio" name="fit" value="Male"> Male</label>
            <label><input type="radio" name="fit" value="Female"> Female</label>
            <label><input type="radio" name="fit" value="Unisex"> Unisex</label>
        </fieldset>

        <button type="submit">Upload & Remove Background</button>
    </form>
    <script src="main.js"></script>
</body>
</html>
