<div id="upload-modal" class="modal" [class.show]="visible">
  <div class="modal-content">
    <h2>Upload Image</h2>
    
    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    
    <form id="upload-form" (ngSubmit)="onSubmit(uploadForm)" #uploadForm="ngForm">
      <select name="category" required title="Select clothing category" ngModel>
        <option value="">Select Category</option>
        <option value="casual">Casual</option>
        <option value="athletic">Athletic</option>
        <option value="sleep">Sleep</option>
      </select>
      
      <select name="section" required title="Select clothing section" ngModel>
        <option value="">Select Section</option>
        <option value="tops">Top</option>
        <option value="bottoms">Bottom</option>
        <option value="layers">Layer</option>
      </select>
      
      <input 
        type="file" 
        name="image" 
        accept="image/*" 
        required 
        title="Choose an image to upload"
        (change)="onFileSelected($event)"
      />
      
      <div class="file-info" *ngIf="selectedFile">
        <small>Selected: {{ selectedFile.name }} ({{ (selectedFile.size / 1024 / 1024).toFixed(2) }}MB)</small>
      </div>
      
      <div class="modal-buttons">
        <button 
          type="submit" 
          [disabled]="!uploadForm.valid || uploading || !selectedFile"
        >
          {{ uploading ? 'Uploading...' : 'Upload' }}
        </button>
        <button type="button" (click)="close()" [disabled]="uploading">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
