<div id="upload-modal" class="modal" [class.show]="visible">
  <div class="modal-content">
    <h2>Upload Images</h2>
    
    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    
    <form id="upload-form" (ngSubmit)="onSubmit(uploadForm)" #uploadForm="ngForm">
      <select name="category" required title="Select clothing category" ngModel>
        <option value="">Select Category</option>
        <option value="casual">Casual</option>
        <option value="athletic">Athletic</option>
        <option value="sleep">Sleep</option>
      </select>
      
      <select name="section" required title="Select clothing section" ngModel>
        <option value="">Select Section</option>
        <option value="tops">Top</option>
        <option value="bottoms">Bottom</option>
        <option value="layers">Layer</option>
      </select>
      
      <input 
        type="file" 
        name="images" 
        accept="image/*" 
        multiple
        required 
        title="Choose images to upload"
        (change)="onFileSelected($event)"
      />
      
      <div class="file-info" *ngIf="selectedFiles.length > 0">
        <div *ngFor="let file of selectedFiles">
          <small>{{ file.name }} ({{ (file.size / 1024 / 1024).toFixed(2) }}MB)</small>
        </div>
        <p><strong>{{ selectedFiles.length }} file(s) selected</strong></p>
      </div>
      
      <div class="modal-buttons">
        <button 
          type="submit" 
          [disabled]="!uploadForm.valid || uploading || selectedFiles.length === 0"
        >
          {{ uploading ? 'Uploading...' : 'Upload ' + selectedFiles.length + ' file(s)' }}
        </button>
        <button type="button" (click)="close()" [disabled]="uploading">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
