<div id="manage-presets-modal" class="modal" [class.show]="visible">
  <div class="modal-content">
    <h2>Manage Favorite Presets</h2>
    <ul id="presets-list">
      <li *ngFor="let preset of favorites; let i = index">
        Preset {{ i + 1 }}
        <button (click)="deletePreset(i)">Delete</button>
      </li>
    </ul>
    <div class="modal-buttons">
      <button type="button" (click)="close()">Close</button>
    </div>
  </div>
</div>
