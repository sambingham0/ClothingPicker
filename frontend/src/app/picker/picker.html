<div id="top-bar">
  <button id="user-profile-btn" (click)="openUserProfileModal()" title="User Profile">
    <span>Profile</span>
  </button>
  <select id="category-select" title="Filter by clothing category"
          [(ngModel)]="state.activeCategory"
          (ngModelChange)="onCategoryChange($event)">
    <option *ngFor="let cat of categories" [value]="cat">{{ cat | titlecase }}</option>
  </select>
  <button id="random-btn" (click)="randomize()">Random</button>
  <button id="toggle-layer-btn" (click)="toggleLayer()">
    {{ state.layerVisible ? 'Remove Layer' : 'Show Layer' }}
  </button>

  <div class="dropdown" (clickOutside)="closeUploadsMenu()">
    <button id="uploads-btn" 
      (click)="toggleUploadsMenu()" 
      [class.active]="uploadsMenuOpen">
      Uploads
    </button>
    <div class="dropdown-menu" [class.show]="uploadsMenuOpen">
      <button class="dropdown-item" (click)="openUploadModal()">
        Upload Images
      </button>
      <button class="dropdown-item" (click)="openManageImagesModal()">
        Manage Images
      </button>
    </div>
  </div>

  <div class="dropdown" (clickOutside)="closePresetsMenu()">
    <button id="presets-btn" 
      (click)="togglePresetsMenu()" 
      [class.active]="presetsMenuOpen">
      Presets
    </button>
    <div class="dropdown-menu" [class.show]="presetsMenuOpen">
      <button class="dropdown-item" 
              (click)="savePreset()" 
              [disabled]="state.activeCategory === 'presets'">
        Save Preset
      </button>
      <button class="dropdown-item" (click)="openManagePresetsModal()">
        Manage Presets
      </button>
    </div>
  </div>
</div>

<!-- Weather widget positioned beside picker -->
<app-weather-modal></app-weather-modal>

<!-- Show preset info when in presets mode -->
<div id="preset-info" *ngIf="state.activeCategory === 'presets'" class="preset-info">
  <div class="preset-name">{{ getCurrentPresetName() }}</div>
  <div class="preset-count">{{ getPresetInfo() }}</div>
</div>

<div id="picker-grid">
  <ng-container *ngFor="let section of sections">
    <div class="section-container" [attr.data-section]="section" *ngIf="!(section === 'layers' && !state.layerVisible)">
      <button class="cycle-btn up-btn" (click)="cycle(section, -1)">▲</button>
      <div class="image-viewport" [id]="section + '-viewport'">
        <img 
          *ngIf="getCurrentImage(section)" 
          [src]="getCurrentImage(section)" 
          alt="Clothes Image" 
          title="Clothes Image"
          loading="lazy" />
        <span *ngIf="!getCurrentImage(section)">
          {{ state.activeCategory === 'presets' ? 'No item in this preset' : 'No image available for ' + section }}
        </span>
      </div>
      <button class="cycle-btn down-btn" (click)="cycle(section, 1)">▼</button>
    </div>
  </ng-container>
</div>

<div id="bottom-bar">
  <div class="dropdown-mobile">
    <button id="uploads-btn-mobile" 
            (click)="toggleUploadsMenu()" 
            [class.active]="uploadsMenuOpen">
      Uploads {{ uploadsMenuOpen ? '▲' : '▼' }}
    </button>
    <div class="dropdown-menu-mobile" [class.show]="uploadsMenuOpen">
      <button class="dropdown-item-mobile" 
              (click)="openUploadModal(); closeUploadsMenu()">
        Upload Images
      </button>
      <button class="dropdown-item-mobile" 
              (click)="openManageImagesModal(); closeUploadsMenu()">
        Manage Images
      </button>
    </div>
  </div>
  
  <div class="dropdown-mobile">
    <button id="presets-btn-mobile" 
            (click)="togglePresetsMenu()" 
            [class.active]="presetsMenuOpen">
      Presets {{ presetsMenuOpen ? '▲' : '▼' }}
    </button>
    <div class="dropdown-menu-mobile" [class.show]="presetsMenuOpen">
      <button class="dropdown-item-mobile" 
              (click)="savePreset(); closePresetsMenu()" 
              [disabled]="state.activeCategory === 'presets'">
        Save Preset
      </button>
      <button class="dropdown-item-mobile" 
              (click)="openManagePresetsModal(); closePresetsMenu()">
        Manage Presets
      </button>
    </div>
  </div>
</div>

<div id="footer-msg">{{ footerMsg }}</div>

<app-user-profile-modal #userProfileModal></app-user-profile-modal>
<app-upload-modal #uploadModal (uploadComplete)="onUploadComplete()"></app-upload-modal>
<app-manage-images-modal #manageImagesModal></app-manage-images-modal>
<app-manage-presets-modal #managePresetsModal></app-manage-presets-modal>
<app-name-preset-modal #namePresetModal 
  (presetNamed)="onPresetNamed($event)"
  (cancelled)="onPresetNameCancelled()">
</app-name-preset-modal>
