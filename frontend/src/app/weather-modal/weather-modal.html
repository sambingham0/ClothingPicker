<div class="weather-widget" [class.expanded]="visible">
  <div class="weather-toggle" (click)="toggle()">
    <span class="weather-icon">🌤️</span>
    <span class="toggle-text">{{ visible ? 'Hide Weather' : 'Show Weather' }}</span>
  </div>
  
  <div class="weather-content" *ngIf="visible">
    <div class="weather-header">
      <h3>Current Weather</h3>
      <button class="refresh-btn" (click)="refresh()" [disabled]="loading">
        <span [class.spinning]="loading">🔄</span>
      </button>
    </div>
    
    <div *ngIf="loading" class="weather-loading">
      Loading weather data...
    </div>
    
    <div *ngIf="error" class="weather-error">
      {{ error }}
      <button (click)="refresh()">Retry</button>
    </div>
    
    <div *ngIf="weatherData && !loading && !error" class="weather-info">
      <div class="location">{{ weatherData.location }}</div>
      
      <div class="main-weather">
        <img 
          [src]="'https://openweathermap.org/img/wn/' + weatherData.icon + '@2x.png'" 
          [alt]="weatherData.description"
          title="Weather Data"
          class="weather-icon-img">
        <div class="temperature">{{ weatherData.temperature }}°F</div>
      </div>
      
      <div class="description">{{ weatherData.description | titlecase }}</div>
      
      <div class="weather-details">
        <div class="detail-item">
          <span class="detail-label">Humidity:</span>
          <span class="detail-value">{{ weatherData.humidity }}%</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind:</span>
          <span class="detail-value">{{ weatherData.windSpeed }} mph</span>
        </div>
      </div>
    </div>
  </div>
</div>
